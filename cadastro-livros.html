<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Livros</title>
</head>
<body>
    <header class="cartao-titulo"><h1>Lybersystema</h1></header>
    <hr>
    <div class="formulario">
        <form action="//">
            <fieldset>
                <legend><strong>&#128214; Cadastro de Livros &#128214;</strong></legend>
                <label for="titulo">Titulo:</label> <br>
                <input type="text" name="titulo"> <br><br>
                <label for="autor">Autor do Livro:</label><br>
                <input type="text" name="autor"><br><br>
                <label for="data-publicacao">Data de Publicação: </label><br>
                <input type="date" name="data-publicacao" id=""> <br><br>
                <label for="genero">Gênero: </label> <br>
                <input type="checkbox" name="genero"> <label for="genero">Fantasia</label> <br>
                <input type="checkbox" name="genero"> <label for="genero">Ficção Científica</label> <br>
                <input type="checkbox" name="genero"> <label for="genero">Romance</label> <br>
                <input type="checkbox" name="genero"> <label for="genero">Ficção</label> <br>
                <input type="checkbox" name="genero"> <label for="genero">Biografia</label> <br>
                <input type="checkbox" name="genero"> <label for="genero">Não-Ficção</label> <br>
                <input type="checkbox" name="genero"> <label for="genero">Ação</label> <br>

            </fieldset>
        </form>
    </div>
</body>
</html>
